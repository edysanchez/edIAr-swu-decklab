name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Extended Ruff checks (advisory)
        continue-on-error: true
        run: |
          python -m ruff check . \
            --select I,C90,PLR0911,PLR0912,PLR0913,PLR0915 \
            --output-format=github

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install ".[dev]"

      - name: Type check domain and infrastructure
        run: python -m mypy

      - name: Type check scripts
        run: python -m mypy skills/swu-review/scripts
