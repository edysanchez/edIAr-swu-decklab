name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip jsonschema

      - name: Run the data-free suite
        run: python -m unittest discover -s skills/swu-review/tests

      - name: Check that no card data is tracked
        run: test -z "$(git ls-files data)"
