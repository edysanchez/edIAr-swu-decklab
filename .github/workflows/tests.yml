name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install ".[dev]"

      - name: Run the data-free suite with coverage
        run: |
          python -m coverage run -m unittest discover -s skills/swu-review/tests
          python -m coverage report -m

      - name: Run factory tooling tests
        run: python -m unittest discover -s factory/tests

      - name: Check that no card data is tracked
        run: test -z "$(git ls-files data)"
